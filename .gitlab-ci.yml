# Tests merge requests and the default branch; only the default branch deploys to GitLab Pages.
# The ONNX models are not in git (see .gitignore): the `models` job exports them with export.py and
# caches the result, so they are only rebuilt when export.py or its lock file changes.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

models:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files: [export.py, export.py.lock]
    paths: [public/*.onnx]
  script:
    - |
      for model in esrgan_x2 esrgan_x2_fp16 esrgan_x4 esrgan_x4_fp16; do
        test -f "public/$model.onnx" || { uv run --locked --script export.py; break; }
      done
  artifacts:
    paths: [public/*.onnx]
    expire_in: 1 day

lint:
  stage: test
  image: node:24-slim
  needs: []
  script:
    - npm ci --ignore-scripts
    - npm run lint

# Chromium, Firefox and WebKit, as locally, under a hard 4 GB cap (no swap): over it, the kernel kills a
# browser and the job fails. The runners have no GPU, so WebGPU and fp16 cases skip. test:pwa then checks the
# built app and its service worker.
test:
  stage: test
  image: docker:27-cli
  services: [docker:27-dind]
  needs: [models]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble # keep in step with the playwright devDependency
  script:
    - docker create --name tests --memory=4g --memory-swap=4g -w /app $PLAYWRIGHT_IMAGE sh -c "npm ci --ignore-scripts && npm test && npm run test:pwa"
    - docker cp . tests:/app
    - docker start --attach tests

pages:
  stage: deploy
  image: node:24-slim
  needs: [models, lint, test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # VITE_SENTRY_DSN, VITE_GOATCOUNTER_URL, VITE_GOOGLE_SITE_VERIFICATION and VITE_BING_SITE_VERIFICATION come from the project's CI/CD variables (protected and masked).
  variables:
    VITE_SENTRY_RELEASE: upscale@$CI_COMMIT_SHORT_SHA
  script:
    - npm ci --ignore-scripts
    - npm run build
    # Pages sends file.gz instead of file to browsers that accept gzip: the 28 MB WASM runtime is ~7 MB compressed.
    - find dist -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.wasm" \) -exec gzip -9 --keep {} +
  pages:
    publish: dist
